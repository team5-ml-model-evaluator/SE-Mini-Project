
name: Python CI

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Install dependencies and run tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ ! -f requirements.txt ]; then
            echo "::error::requirements.txt not found."
            exit 1
          fi

          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Verify Python test files exist
        shell: bash
        run: |
          if [ ! -d tests ]; then
            echo "::error::The tests directory was not found."
            exit 1
          fi

          TEST_FILE=$(find tests -type f -name "test_*.py" -print -quit)

          if [ -z "$TEST_FILE" ]; then
            echo "::error::No Python test files found. Tests were not run."
            exit 1
          fi

          echo "Found test file: $TEST_FILE"

      - name: Run tests
        run: python -m pytest -q tests/ webui/
